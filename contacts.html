<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts</title>
    <script src="script.js"></script>
    <script src="/js/contacts.js"></script>
    <script src="/js/templates.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/contacts.css">
    <link rel="stylesheet" href="/css/add_task.css">
</head>

<body onload="init('nav_item_contacts'); renderAllContacts()">
    <aside w3-include-html="/templates/navigation_side.html"></aside>
    <main class="contacts_main">
        <header w3-include-html="/templates/header.html"></header>
        <section class="contacts_main_flex">
            <nav class="contacts_navigation">
                <button onclick="openAddContactDialog()">Add new contact <img src="assets/img/person_add.png"></button>
                <section>
                    <div id="contact_list"></div>
                </section>
            </nav>
            <aside>
                <section class="headline_section">
                    <h1>Contacts</h1>
                    <div class="contacts_headline_border"></div>
                    <span class="contacts_headline_subelement">Better with a team</span>
                </section>
                <article id="current_contact_ref"></article>
            </aside>

        </section>
    </main>

    <dialog class="add_contact_dialog" id="add_contact_dialog_ref"></dialog>
</body>

</html>
